name: Test PG encrypted relay
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check server/server.mjs && node --check server/test.mjs
      - name: Run two-client API and cryptography integration checks
        working-directory: server
        run: node test.mjs
