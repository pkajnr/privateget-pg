name: Verify PG Flutter source
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/prepare-mobile.sh'
      - '.github/workflows/pg-flutter-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/prepare-mobile.sh'
      - '.github/workflows/pg-flutter-check.yml'
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform files, run tests and analyze
        run: bash scripts/prepare-mobile.sh
